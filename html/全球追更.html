            const d = new Date();
            const p = (n) => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
        }

        function hasCJK(s) { return /[\u4e00-\u9fff]/.test(s || ''); }

        async function tmdbGet(path, params) {
            const q = new URLSearchParams(Object.assign({ api_key: TMDB_KEY, language: 'zh-CN' }, params || {}));
            const res = await fetch(TMDB_API + path + '?' + q.toString(), { cache: 'no-store' });
            if (!res.ok) throw new Error('TMDB HTTP ' + res.status);
            return res.json();
        }

        function renderGzChips() {
            $('gzPlatforms').innerHTML = GZ_PLATFORMS.map((p) =>
                '<button class="tab ' + (p.id === gz.platform ? 'active' : '') + '" data-gzp="' + p.id + '">' + escapeHtml(p.name) + '</button>').join('');
            $('gzPlatforms').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { gz.platform = b.dataset.gzp; renderGzChips(); gzLoad(false); }));
            $('gzSorts').innerHTML = GZ_SORTS.map((s) =>
                '<button class="chart-tab ' + (s.v === gz.sort ? 'active' : '') + '" data-gzs="' + escapeAttr(s.v) + '">' + escapeHtml(s.n) + '</button>').join('');
            $('gzSorts').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { gz.sort = b.dataset.gzs; renderGzChips(); gzLoad(false); }));
            $('gzTypes').innerHTML = GZ_TYPES.map((t) =>
                '<button class="chart-tab ' + (t.v === gz.type ? 'active' : '') + '" data-gzt="' + escapeAttr(t.v) + '">' + escapeHtml(t.n) + '</button>').join('');
            $('gzTypes').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { gz.type = b.dataset.gzt; renderGzChips(); gzLoad(false); }));
        }

        function gzCardHtml(item, media) {
            if (item && item.id) gzItems[media + ':' + item.id] = item;
            const title = item.name || item.title || '';
            const poster = item.poster_path ?
                '<img src="' + TMDB_IMG + escapeAttr(item.poster_path) + '" alt="' + escapeAttr(title) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer">' : '';
            const date = item.first_air_date || item.release_date || '';
            const rate = item.vote_average ? '⭐' + (Math.round(item.vote_average * 10) / 10) : '';
            const remark = [rate, date].filter(Boolean).join(' · ') || (media === 'tv' ? '剧集' : '电影');
            const data = encodeURIComponent(JSON.stringify({
                title: title,
                media_type: media,
                tmdb_id: item.id || '',
                poster: item.poster_path ? TMDB_IMG + item.poster_path : '',
                backdrop: item.backdrop_path ? TMDB_IMG_BIG + item.backdrop_path : '',
            }));
            return '<article class="card" data-title="' + escapeAttr(title) + '" data-gzid="' + escapeAttr(String(item.id || '')) + '">' +
                '<div class="poster">' + poster + '</div>' +
                '<div class="meta">' +
                '<div class="name">' + escapeHtml(title) + '</div>' +
                '<div class="kind" data-remark>' + escapeHtml(remark) + '</div>' +
                '</div>' +
                '<div class="actions">' +
                '<button class="mini play" type="button" data-play="' + data + '">盘搜</button>' +
                '<button class="mini" type="button" data-copy="' + data + '" title="复制片名">复制</button>' +
                '</div></article>';
        }

        function wireGzCards() {
            $('gzContent').querySelectorAll('.card').forEach((card) => {
                if (card.dataset.wired) return;
                card.dataset.wired = '1';
                card.addEventListener('click', () => {
                    const btn = card.querySelector('[data-play]');
                    if (!btn) return;
                    const p = JSON.parse(decodeURIComponent(btn.dataset.play));
                    const rk = card.querySelector('[data-remark]');
                    if (rk && rk.textContent) p.remark = rk.textContent;
                    openInfo(p);
                });
            });
            $('gzContent').querySelectorAll('[data-play]').forEach((btn) => {
                if (btn.dataset.wired) return;
                btn.dataset.wired = '1';
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    searchPanResources(JSON.parse(decodeURIComponent(btn.dataset.play)));
                });
            });
            $('gzContent').querySelectorAll('[data-copy]').forEach((btn) => {
                if (btn.dataset.wired) return;
                btn.dataset.wired = '1';
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyName(JSON.parse(decodeURIComponent(btn.dataset.copy)));
                });
            });
        }

        async function gzEnrich(items, media) {
            const needTrack = media === 'tv' && gz.sort !== 'popularity.desc';
            await Promise.all(items.map(async (it) => {
                let title = it.name || it.title || '';
                if (!needTrack && hasCJK(title)) return;
                const card = $('gzContent').querySelector('[data-gzid="' + it.id + '"]');
                if (!card) return;
                try {
                    const d = await tmdbGet('/' + media + '/' + it.id, { append_to_response: 'alternative_titles' });
                    if (!hasCJK(title)) {
                        const alt = ((d.alternative_titles || {}).titles || (d.alternative_titles || {}).results || []);
                        const cn = alt.find((t) => t.iso_3166_1 === 'CN' && t.title);
                        if (cn) {
                            title = cn.title;
                            card.dataset.title = title;
                            const nm = card.querySelector('.name');
                            if (nm) nm.textContent = title;
                            const enc = encodeURIComponent(JSON.stringify({ title: title, media_type: media, tmdb_id: it.id, poster: it.poster_path ? TMDB_IMG + it.poster_path : '', backdrop: it.backdrop_path ? TMDB_IMG_BIG + it.backdrop_path : '' }));
                            card.querySelectorAll('[data-play]').forEach((b) => { b.dataset.play = enc; });
                            card.querySelectorAll('[data-copy]').forEach((b) => { b.dataset.copy = enc; });
                        }
                    }
                    if (needTrack) {
                        const ep = d.next_episode_to_air || d.last_episode_to_air;
                        const rk = card.querySelector('[data-remark]');
                        if (ep && rk) {
                            rk.textContent = (d.next_episode_to_air ? '🕒' : '✅') + String(ep.air_date || '').slice(5) +
                                ' S' + String(ep.season_number || 0).padStart(2, '0') + 'E' + String(ep.episode_number || 0).padStart(2, '0');
                        }
                    }
                } catch (e) { }
            }));
        }

        async function gzLoad(append) {
            if (gz.loading) return;
            gz.loading = true;
            const plat = GZ_PLATFORMS.find((p) => p.id === gz.platform) || GZ_PLATFORMS[0];
            const media = gzMedia();
            const endpoint = media === 'movie' ? '/discover/movie' : '/discover/tv';
            if (!append) {
                gz.page = 1;
                gz.seen = new Set();
                $('gzContent').innerHTML = '<div class="empty">加载中...</div>';
            }
            try {
                const base = { page: gz.page, sort_by: (gz.sort === 'daily_airing' || gz.sort === 'next_episode') ? 'popularity.desc' : gz.sort };
                if (gz.type === 'anime') base.with_genres = '16';
                if (gz.type === 'variety') base.with_genres = '10764|10767';
                if (gz.sort === 'daily_airing') {
                    if (media === 'tv') { base['air_date.gte'] = gzToday(); base['air_date.lte'] = gzToday(); }
                    else { base['primary_release_date.gte'] = gzToday(); base['primary_release_date.lte'] = gzToday(); }
                }
                let items = [];
                for (const net of plat.network.split('|')) {
                    const data = await tmdbGet(endpoint, Object.assign({}, base, { with_networks: net }));
                    items = items.concat(data.results || []);
                }
                const fresh = [];
                for (const it of items) {
                    const id = String(it.id || '');
                    if (!id || gz.seen.has(id)) continue;
                    gz.seen.add(id);
                    fresh.push(it);
                }
                if (gz.sort === 'popularity.desc') {
                    fresh.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
                } else {
                    fresh.sort((a, b) => String(b.first_air_date || b.release_date || '').localeCompare(String(a.first_air_date || a.release_date || '')));
                }
                const pageItems = fresh.slice(0, 20);
                const html = pageItems.length ? '<div class="grid">' + pageItems.map((it) => gzCardHtml(it, media)).join('') + '</div>' : '';
                if (append) {
                    if (html) $('gzContent').insertAdjacentHTML('beforeend', html);
                } else {
                    $('gzContent').innerHTML = html || '<div class="empty">暂无内容</div>';
                }
                $('gzMore').style.display = pageItems.length ? '' : 'none';
                wireGzCards();
                prefetchHeroImages(pageItems);
                cacheGridPosters();
                gzEnrich(pageItems, media);
            } catch (err) {
                if (!append) $('gzContent').innerHTML = '<div class="error">加载失败：' + escapeHtml(err.message || String(err)) + '</div>';
                $('gzMore').style.display = 'none';
            }
            gz.loading = false;
        }

        let lastMainTab = 'gz';
        function switchMain(which) {
            lastMainTab = which;
            const isGz = which === 'gz';
            $('panelGz').style.display = isGz ? '' : 'none';
            $('panelCharts').style.display = isGz ? 'none' : '';
            $('panelSearch').style.display = 'none';
            $('mainTabGz').classList.toggle('active', isGz);
            $('mainTabCharts').classList.toggle('active', !isGz);
        }

        // 本页搜片: 在 TMDB 片库里搜, 结果直接在本页出卡片(点卡看详情/盘搜), 不跳壳子全网搜索
        async function pageSearch(query) {
            closeInfo();
            closePanSheet();
            $('panelGz').style.display = 'none';
            $('panelCharts').style.display = 'none';
            $('panelSearch').style.display = '';
            $('searchTitle').textContent = '搜索：' + query;
            const box = $('searchContent');
            box.innerHTML = '<div class="empty">搜索中...</div>';
            try {
                const data = await tmdbGet('/search/multi', { query });
                const items = (data.results || []).filter((it) => (it.media_type === 'tv' || it.media_type === 'movie') && it.poster_path);
                items.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
                const top = items.slice(0, 30);
                if (!top.length) {
                    box.innerHTML = '<div class="empty">本页片库没找到「' + escapeHtml(query) + '」</div>';
                    return;
                }
                top.forEach((it) => { gzItems[it.media_type + ':' + it.id] = it; });
                const entries = top.map((it) => ({
                    title: it.name || it.title || '',
                    poster: TMDB_IMG + it.poster_path,
                    backdrop: it.backdrop_path ? TMDB_IMG_BIG + it.backdrop_path : '',
                    tmdb_id: String(it.id || ''),
                    media_type: it.media_type,
                    rank: '',
                }));
                box.innerHTML = '<div class="grid">' + entries.map(cardHtml).join('') + '</div>';
                box.querySelectorAll('.card').forEach((card) => {
                    card.addEventListener('click', () => {
                        const btn = card.querySelector('[data-play]');
                        if (btn) openInfo(JSON.parse(decodeURIComponent(btn.dataset.play)));
                    });
                });
                box.querySelectorAll('[data-play]').forEach((btn) => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        searchPanResources(JSON.parse(decodeURIComponent(btn.dataset.play)));
                    });
                });
                box.querySelectorAll('[data-copy]').forEach((btn) => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        copyName(JSON.parse(decodeURIComponent(btn.dataset.copy)));
                    });
                });
                prefetchHeroImages(top);
                cacheGridPosters();
            } catch (err) {
                box.innerHTML = '<div class="error">搜索失败：' + escapeHtml(err.message || String(err)) + '</div>';
            }
        }

        /* ========== 事件绑定 ========== */
        const searchInput = $('webhtvSearchInput');
        const searchBtn = $('webhtvSearchBtn');
        const reloadBtn = $('reloadBtn');

        function performSearchFromInput() {
            const query = searchInput.value.trim();
            if (query) pageSearch(query);
        }

        searchBtn.addEventListener('click', performSearchFromInput);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                performSearchFromInput();
            }
        });

        reloadBtn.addEventListener('click', load);
        $('searchClear').addEventListener('click', () => {
            $('searchContent').innerHTML = '';
            switchMain(lastMainTab);
        });

        $('panClose').addEventListener('click', closePanSheet);
        $('infoClose').addEventListener('click', closeInfo);
        $('infoSheet').addEventListener('click', (event) => {
            if (event.target === $('infoSheet')) closeInfo();
        });
        $('infoSearch').addEventListener('click', () => {
            if (!infoCurrent) return;
            const title = infoCurrent.title;
            closeInfo();
            triggerWebhtvSearch(title);
        });
        $('infoPan').addEventListener('click', () => {
            const sec = $('dPanSection');
            if (sec && sec.style.display !== 'none' && state.panSource === 'pan' && state.panKeyword === (infoCurrent && infoCurrent.title)) { sec.scrollIntoView({ block: 'start' }); return; }
            if (!infoCurrent) return;
            searchPanResources({ title: infoCurrent.title, poster: infoCurrent.poster || '' }, { view: 'detail', source: 'pan' });
        });
        $('infoMipan').addEventListener('click', () => {
            const sec = $('dPanSection');
            if (sec && sec.style.display !== 'none' && state.panSource === 'mipan' && state.panKeyword === (infoCurrent && infoCurrent.title)) { sec.scrollIntoView({ block: 'start' }); return; }
            if (!infoCurrent) return;
            searchPanResources({ title: infoCurrent.title, poster: infoCurrent.poster || '' }, { view: 'detail', source: 'mipan' });
        });
        $('panSheet').addEventListener('click', (event) => {
            if (event.target === $('panSheet')) closePanSheet();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                if ($('infoSheet').classList.contains('active')) {
                    closeInfo();
                } else if ($('panSheet').classList.contains('active')) {
                    closePanSheet();
                } else {
                    $('toast').style.display = 'none';
                    clearTimeout(toast.timer);
                }
            }
        });

        $('mainTabGz').addEventListener('click', () => switchMain('gz'));
        $('mainTabCharts').addEventListener('click', () => switchMain('charts'));
        $('gzMore').addEventListener('click', () => { gz.page += 1; gzLoad(true); });

        initPanBase();
        renderGzChips();
        gzLoad(false);
        load();
    </script>
<style>/* GZVAR 07-折叠筛选条 */

.search-row{position:relative}
h1.gz-wm{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:800;letter-spacing:1px;color:var(--ink);opacity:.5;pointer-events:none;z-index:2;margin:0}

.title-row{display:none}

.search-row.gz-searching input{padding-left:12px}
#gzHist{display:none;gap:8px;flex-wrap:wrap;margin-top:8px}
.hist-chip{background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.hist-clear{background:transparent;border:none;color:var(--ink-soft);font-size:12.5px;cursor:pointer;padding:5px 4px;text-decoration:underline}
</style>
<script>
(function () {
  try {
    var h1 = document.querySelector('.title-row h1');
    var row = document.querySelector('.search-row');
    if (h1 && row) {
      h1.textContent = '追更';
      h1.classList.add('gz-wm');
      row.appendChild(h1);
    }
    var st = document.getElementById('status');
    if (st && row) {
      st.classList.add('gz-in');
      row.appendChild(st);
    }
  } catch (e) { }
  var HKEY = 'gzSearchHistoryV1';
  var hist = [];
  try { hist = JSON.parse(localStorage.getItem(HKEY) || '[]'); if (!Array.isArray(hist)) hist = []; } catch (e) { hist = []; }
  hist = hist.filter(function (x) { return typeof x === 'string' && x; }).slice(0, 10);
  var box = null;
  var input = document.getElementById('webhtvSearchInput');
  function save() { try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch (e) { } }
  function renderHist() {
    if (!box) return;
    if (!hist.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.style.display = 'flex';
    box.innerHTML = hist.map(function (k) { return '<button type="button" class="hist-chip" data-k="' + escapeAttr(k) + '">' + escapeHtml(k) + '</button>'; }).join('') + '<button type="button" class="hist-clear">清空</button>';
    box.querySelectorAll('.hist-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        if (input) input.value = b.dataset.k;
        if (typeof performSearchFromInput === 'function') performSearchFromInput();
      });
    });
    var clr = box.querySelector('.hist-clear');
    if (clr) clr.addEventListener('click', function () { hist = []; save(); renderHist(); });
  }
  function record(q) {
    q = String(q || '').trim();
    if (!q) return;
    hist = [q].concat(hist.filter(function (x) { return x !== q; })).slice(0, 10);
    save(); renderHist();
  }
  try {
    var rowEl = document.querySelector('.search-row');
    if (rowEl) {
      box = document.createElement('div');
      box.id = 'gzHist';
      rowEl.insertAdjacentElement('afterend', box);
      renderHist();
    }
  } catch (e) { }
  if (typeof pageSearch === 'function') {
    var orig = pageSearch;
    pageSearch = function (q) { record(q); return orig.apply(null, arguments); };
  }
  try {
    var srow = document.querySelector('.search-row');
    if (input && srow) {
      var syncSearching = function () {
        srow.classList.toggle('gz-searching', document.activeElement === input || !!input.value);
      };
      input.addEventListener('focus', syncSearching);
      input.addEventListener('blur', function () { setTimeout(syncSearching, 0); });
      input.addEventListener('input', syncSearching);
    }
  } catch (e) { }
})();
</script>
<style>/* GZTHEME 紫夜背景 */
:root{--bg:#171226}
</style>
<style>/* GZTINT 详情层自适应海报色 */
.info-sheet{background:rgb(var(--gzTintRGB,10,5,12))}
.info-bottom{background:linear-gradient(to bottom,rgba(var(--gzTintRGB,10,5,12),0),rgba(var(--gzTintRGB,10,5,12),.45) 40%,rgba(var(--gzTintRGB,10,5,12),.86))}
.info-pill{background:rgba(var(--gzTintRGB,10,5,12),.48)}
.info-act{background:rgba(var(--gzTintRGB,10,5,12),.5)}
</style>
<script>
(function () {
  var cache = {};
  var curTint = '10,5,12';
  function setTint(rgb) {
    curTint = rgb;
    var sh = document.getElementById('infoSheet');
    if (sh) sh.style.setProperty('--gzTintRGB', rgb);
    if (sh && sh.classList.contains('active')) document.body.style.background = 'rgb(' + rgb + ')';
  }
  try {
    var sheetEl = document.getElementById('infoSheet');
    if (sheetEl && typeof MutationObserver === 'function') {
      new MutationObserver(function () {
        if (sheetEl.classList.contains('active')) document.body.style.background = 'rgb(' + curTint + ')';
        else document.body.style.background = '';
      }).observe(sheetEl, { attributes: true, attributeFilter: ['class'] });
    }
  } catch (e) { }
  function sample(url) {
    if (!url) return;
    if (cache[url]) { setTint(cache[url]); return; }
    var src = url;
    try { if (typeof tmdbSize === 'function') src = tmdbSize(url, 'w780'); } catch (e) { }
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function () {
      try {
        var cv = document.createElement('canvas');
        cv.width = 48; cv.height = 48;
        var cx = cv.getContext('2d');
        cx.drawImage(img, 0, 0, 48, 48);
        var d = cx.getImageData(0, 0, 48, 48).data;
        var buckets = {}, bestKey = null, bestCount = 0;
        var sr = 0, sg = 0, sb = 0, sn = 0;
        for (var i = 0; i < d.length; i += 4) {
          var r = d[i], g = d[i + 1], b = d[i + 2];
          sr += r; sg += g; sb += b; sn++;
          var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          if (!mx) continue;
          var sat = (mx - mn) / mx, val = mx / 255;
          if (sat < 0.25 || val < 0.15 || val > 0.95) continue;
          var key = (r >> 4) + ',' + (g >> 4) + ',' + (b >> 4);
          var bk = buckets[key] || (buckets[key] = { r: 0, g: 0, b: 0, n: 0 });
          bk.r += r; bk.g += g; bk.b += b; bk.n++;
          if (bk.n > bestCount) { bestCount = bk.n; bestKey = key; }
        }
        if (!sn) return;
        var rgb;
        if (bestKey) {
          var bb = buckets[bestKey];
          rgb = Math.round(bb.r / bb.n) + ',' + Math.round(bb.g / bb.n) + ',' + Math.round(bb.b / bb.n);
        } else {
          rgb = Math.round(sr / sn) + ',' + Math.round(sg / sn) + ',' + Math.round(sb / sn);
        }
        cache[url] = rgb;
        setTint(rgb);
      } catch (e) { }
    };
    img.src = src;
  }
  if (typeof openInfo === 'function') {
    var orig = openInfo;
    openInfo = function (p) {
      setTint('10,5,12');
      var ret = orig.apply(null, arguments);
      try {
        var bgEl = document.getElementById('infoBg');
        var src = (bgEl && bgEl.getAttribute('src')) || (p && (p.backdrop || p.poster)) || '';
        if (src) sample(src);
      } catch (e) { }
      return ret;
    };
  }
})();
</script>
<style>
/* GZCHARTCAR 榜单实时热门轮播 */
.gzcc{margin:10px 0 4px}
.gzcc-view{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.gzcc-tag{position:absolute;top:10px;left:12px;z-index:3;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#FFD60A;font-size:12px}
.gzcc-track{display:flex;transition:transform .45s ease}
.gzcc-slide{position:relative;flex:0 0 100%;cursor:pointer}
.gzcc-slide img{width:100%;height:176px;object-fit:cover;object-position:center 30%;display:block}
.gzcc-meta{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;background:linear-gradient(180deg,transparent,rgba(8,8,14,.78));color:#fff}
.gzcc-rank{font-size:12px;color:#FFD60A}
.gzcc-title{font-size:18px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.gzcc-dots{position:absolute;right:12px;bottom:12px;display:flex;gap:5px;z-index:3}
.gzcc-dot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.45);transition:all .3s}
.gzcc-dot.on{width:18px;background:#fff}
</style>
<script>
/* GZCHARTCAR 顶部轮播(今天这套):位置固定顶部,追更时跟随当前平台前8、榜单时跟随当前榜单前8 */
(function () {
  if (typeof render !== 'function') return;
  var panelC = document.getElementById('panelCharts');
  var panelS = document.getElementById('panelSearch');
  var mainTabs = document.querySelector('.main-tabs');
  if (!panelC || !mainTabs) return;
  var box = document.createElement('section');
  box.id = 'gzTopCar';
  box.className = 'gzcc';
  box.style.display = 'none';
  mainTabs.parentNode.insertBefore(box, mainTabs);
  var timer = null, idx = 0, count = 0, cur = [], touchX = null, lastGzKey = '';
  function mode() {
    if (panelS && panelS.style.display !== 'none') return 'search';
    return panelC.style.display !== 'none' ? 'charts' : 'gz';
  }
  function pickCharts() {
    var charts = chartsForPlatform(state.platform);
    var chart = charts.find(function (c) { return chartKey(c) === state.chartKey; }) || charts[0];
    if (!chart) return [];
    return (chart.entries || []).slice().sort(function (a, b) { return a.rank - b.rank; }).slice(0, 8).map(function (e, i) {
      return {
        img: e.backdrop || e.poster || '',
        top: '第' + (e.rank || (i + 1)) + '名',
        title: e.title || '',
        payload: { title: e.title || '', media_type: e.media_type || 'movie', tmdb_id: e.tmdb_id || '', poster: e.poster || '', backdrop: e.backdrop || '' }
      };
    });
  }
  function pickGz() {
    var media = gzMedia();
    var out = [];
    document.querySelectorAll('#gzContent .card[data-gzid]').forEach(function (c) {
      var raw = gzItems[media + ':' + c.dataset.gzid];
      if (!raw || !(raw.backdrop_path || raw.poster_path)) return;
      var rate = raw.vote_average ? '⭐' + (Math.round(raw.vote_average * 10) / 10) : '';
      var date = raw.first_air_date || raw.release_date || '';
      out.push({
        img: raw.backdrop_path ? 'https://image.tmdb.org/t/p/w780' + raw.backdrop_path : (TMDB_IMG + raw.poster_path),
        top: [rate, date].filter(Boolean).join(' · '),
        title: raw.name || raw.title || '',
        payload: {
          title: raw.name || raw.title || '', media_type: media, tmdb_id: raw.id || '',
          poster: raw.poster_path ? TMDB_IMG + raw.poster_path : '',
          backdrop: raw.backdrop_path ? TMDB_IMG_BIG + raw.backdrop_path : '',
          remark: [rate, date].filter(Boolean).join(' · ') || (media === 'tv' ? '剧集' : '电影')
        }
      });
    });
    return out.slice(0, 8);
  }
  function build(m) {
    clearInterval(timer); timer = null; idx = 0;
    cur = m === 'charts' ? pickCharts() : pickGz();
    count = cur.length;
    if (m === 'gz') { lastGzKey = gzKey(); if (count < 2) lastGzKey = ''; }
    if (count < 2) { box.innerHTML = ''; box.style.display = 'none'; return; }
    var slides = cur.map(function (s, i) {
      return '<div class="gzcc-slide" data-i="' + i + '">' +
        (s.img ? '<img src="' + escapeAttr(s.img) + '" alt="' + escapeAttr(s.title) + '" referrerpolicy="no-referrer">' : '') +
        '<div class="gzcc-meta">' + (s.top ? '<div class="gzcc-rank">' + escapeHtml(s.top) + '</div>' : '') +
        '<div class="gzcc-title">' + escapeHtml(s.title) + '</div></div></div>';
    }).join('');
    var dots = cur.map(function (_, i) { return '<span class="gzcc-dot' + (i === 0 ? ' on' : '') + '"></span>'; }).join('');
    box.innerHTML = '<div class="gzcc-view"><div class="gzcc-tag">🔥 实时热门</div><div class="gzcc-track">' + slides + '</div><div class="gzcc-dots">' + dots + '</div></div>';
    box.style.display = '';
    var track = box.querySelector('.gzcc-track');
    var dotEls = box.querySelectorAll('.gzcc-dot');
    function go(i) {
      if (box.style.display === 'none') return;
      idx = (i + count) % count;
      track.style.transform = 'translateX(-' + idx * 100 + '%)';
      dotEls.forEach(function (d, j) { d.classList.toggle('on', j === idx); });
    }
    function auto() { clearInterval(timer); timer = setInterval(function () { go(idx + 1); }, 4000); }
    box.querySelectorAll('.gzcc-slide').forEach(function (s) {
      s.addEventListener('click', function () {
        if (box.dataset.swiped === '1') { box.dataset.swiped = ''; return; }
        var it = cur[Number(s.dataset.i) || 0];
        if (it) openInfo(it.payload);
      });
    });
    var view = box.querySelector('.gzcc-view');
    view.addEventListener('touchstart', function (ev) { touchX = ev.touches[0].clientX; clearInterval(timer); }, { passive: true });
    view.addEventListener('touchend', function (ev) {
      if (touchX === null) return;
      var dx = ev.changedTouches[0].clientX - touchX; touchX = null;
      if (Math.abs(dx) > 40) { box.dataset.swiped = '1'; go(idx + (dx < 0 ? 1 : -1)); }
      auto();
    }, { passive: true });
    auto();
  }
  function refresh() { var m = mode(); if (m !== 'search') { try { build(m); } catch (e) {} } }
  var _render = render;
  render = function () { _render(); if (mode() === 'charts') { try { build('charts'); } catch (e) {} } };
  if (typeof gzLoad === 'function') {
    var _gzLoad = gzLoad;
    gzLoad = async function (append) { await _gzLoad(append); if (!append && mode() === 'gz') { try { build('gz'); } catch (e) {} } };
  }
  ['mainTabGz', 'mainTabCharts'].forEach(function (id) {
    var b = document.getElementById(id);
    if (b) b.addEventListener('click', function () { setTimeout(refresh, 0); });
  });
  function gzKey() { var c = document.querySelector('#gzContent .card[data-gzid]'); return c ? c.dataset.gzid : ''; }
  var gcEl = document.getElementById('gzContent');
  if (gcEl && typeof MutationObserver === 'function') {
    new MutationObserver(function () {
      if (mode() !== 'gz') return;
      var k = gzKey();
      if (!k) { lastGzKey = ''; return; }
      if (k === lastGzKey) return;
      lastGzKey = k;
      try { build('gz'); } catch (e) {}
    }).observe(gcEl, { childList: true });
  }
  refresh();
  setTimeout(refresh, 1500);
})();
</script>
